<!DOCTYPE html>
<html lang="esp">

<head>
    <meta charset="UTF-8">
    <title>Practica 1 - Unidad 2</title>
</head>

<body>

    <div class="contenedor">
        <h2>Método de Bissección: el ahorcado</h2>

        <div id="pistaTexto"></div>

        <canvas id="pizarron" width="200" height="200"></canvas>

        <div id="palabra"></div>
        <div id="mensaje"></div>

        <div id="teclado" class="teclas"></div>

        <button id="reset" onclick="iniciarJuego()">
            Nueva Palabra
        </button>

    </div>

    <script>

        //arreglo para las palabras y pistas
        const baseDeDatos = [
            { palabra: "TECLADO", pista: "Dispositivo de entrada" },
            { palabra: "JAVA", pista: "Lenguaje de programación" },
            { palabra: "LEON", pista: "Animal felino" },
            { palabra: "TACOS", pista: "Comida mexicana" },
            { palabra: "CHINO", pista: "Lengua asiatica" },
            { palabra: "NOMBRE", pista: "Tu nombre" }
        ];

        //Variables 
        let secreta, pistaActual, adivinadas, fallos;

        const ctx = document.getElementById("pizarron").getContext("2d");

        //logica del juego
        function iniciarJuego() {
            const item = baseDeDatos[Math.floor(Math.random() * baseDeDatos.length)];
            secreta = item.palabra;
            pistaActual = item.pista;

            adivinadas = [];
            fallos = 0;

            document.getElementById("pistaTexto").innerText = "Pista: " + pistaActual;
            document.getElementById("mensaje").innerText = "";

            ctx.clearRect(0, 0, 200, 200);

            dibujarHorcado();
            generarTeclado();
            actualizarInterfaz();
        }

        function generarTeclado() {

            const teclado = document.getElementById("teclado");
            teclado.innerHTML = "";

            "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(letra => {

                const btn = document.createElement("button");
                btn.innerText = letra;

                btn.onclick = () => {
                    btn.disabled = true;
                    procesarLetra(letra);
                }

                teclado.appendChild(btn);

            });
        }

        //Funcion para procesar letras
        function procesarLetra(l) {

            if (secreta.includes(l)) {
                adivinadas.push(l);
            } else {
                fallos++;
                dibujarCuerpo();
            }

            actualizarInterfaz();
        }

        //funcion para actualizar la interfaz
        function actualizarInterfaz() {
            const visual = secreta.split("").map(l => adivinadas.includes(l) ? l : "_").join(" ");

            document.getElementById("palabra").innerText = visual;

            //condicion de ganar o perder 
            if (!visual.includes("_")) finalizar("Felicidades", "#3BFA00");
            if (fallos > 6) finalizar("Error: la palabra era " + secreta, "#FA400");
        }

        //bloquear el sistema
        function finalizar(msg, color) {

            document.getElementById("mensaje").innerText = msg;
            document.getElementById("mensaje").style.color = color;

            //desabilitar teclas restantes
            document.querySelectorAll(".teclas button").forEach(b => b.disabled = true);
        }

        //funcion para dibujar la estructura estatica
        function dibujarHorcado() {

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#69290C";

            ctx.beginPath();
            ctx.moveTo(20, 180); ctx.lineTo(180, 180);
            ctx.moveTo(50, 180); ctx.lineTo(50, 20);
            ctx.lineTo(120, 20); ctx.lineTo(120, 40);
            ctx.stroke();
        }

        //funcion para dibujar el cuerpo
        function dibujarCuerpo() {

            ctx.beginPath();

            if (fallos == 1) { ctx.arc(120, 60, 20, 0, 7); }
            if (fallos == 2) { ctx.moveTo(120, 80); ctx.lineTo(120, 140); }
            if (fallos == 3) { ctx.moveTo(120, 90); ctx.lineTo(90, 120); }
            if (fallos == 4) { ctx.moveTo(120, 90); ctx.lineTo(150, 120); }
            if (fallos == 5) { ctx.moveTo(120, 140); ctx.lineTo(90, 170); }
            if (fallos == 6) { ctx.moveTo(120, 140); ctx.lineTo(150, 170); }

            ctx.stroke();
        }

        iniciarJuego();

    </script>

</body>

</html>
